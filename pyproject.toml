[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosub"
version = "0.1.0"
description = "General-purpose video/audio VAD transcription and profile-driven bilingual subtitle translation CLI"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
vad = ["onnxruntime>=1.18", "numpy>=1.26"]

[project.scripts]
autosub = "main:main"
